<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Link Not Found</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f8f9fa;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        text-align: center;
        color: #333;
      }
      h1 {
        font-size: 5rem;
        margin: 0;
      }
      p {
        font-size: 1.2rem;
        margin: 10px 0 20px;
      }
      button {
        padding: 10px 20px;
        font-size: 1rem;
        background: #007bff;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover {
        background: #0056b3;
      }
      #countdown {
        font-weight: bold;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>Oops! The link you’re looking for does not exist.</p>
  </body>
</html>
